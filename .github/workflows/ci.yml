name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest became Ubuntu 26.04, and actions/setup-python has no Python 3.9 build for
        # it: the job failed with "The version '3.9' with architecture 'x64' was not found for
        # Ubuntu 26.04" (run 44282890977, 18 November 2026). versions-manifest.json lists 3.9.25
        # for Linux 22.04 and 24.04 only (checked 24 November 2026). So Python 3.9 runs on 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # No network, no real Keychain or Secret Service: the credential-store tests mock the
      # platform commands. The Windows Credential Manager round trip runs for real on windows-latest.
      - run: python -m unittest discover -s tests -v

  coverage:
    # On macOS, where the Keychain branches of token_store run. Windows- and Linux-only branches
    # are not reached here and count as missed (total 92% on macOS, measured 14 October 2026).
    # The README badge states this threshold, so it claims only what this job enforces.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/coverage.txt
      - run: coverage run --branch --source=scripts -m unittest discover -s tests
      - run: coverage report --fail-under=90

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/ruff.txt
      - run: ruff check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/mypy.txt
      - run: mypy scripts

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/bandit.txt
      # -ll: medium severity and above, and nothing is skipped: at this level the scan reports no
      # issues. The low-severity findings it would show without -ll are expected: subprocess is
      # called with argument lists (never a shell), and the token never goes into argv.
      - run: bandit -r scripts -ll

  docs-and-skill:
    name: docs and skill checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python tools/check_docs.py
      - run: python tools/selftest_checks.py
      - run: python tools/validate_skill.py
